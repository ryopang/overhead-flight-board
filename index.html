<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Overhead — Edgewater, NJ</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Overhead" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Archivo:wght@700;800&family=Doto:wght@700..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page" id="page">
<div class="board" id="board" aria-hidden="true">
  <header class="board-header">
    <div class="eyebrow">
      <svg class="plane-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span class="eyebrow-title">OVERHEAD</span>
      <span class="eyebrow-divider">·</span>
      <span class="eyebrow-location" id="eyebrow-location">EDGEWATER, NJ</span>
      <span class="reconnect-badge" id="reconnect-badge" hidden>RECONNECTING&hellip;</span>
    </div>
    <div class="header-right">
      <button class="settings-btn" id="settings-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.5 11a7.6 7.6 0 0 0-.1 1 7.6 7.6 0 0 0 .1 1l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5a.5.5 0 0 0 .6.2l2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6a.5.5 0 0 0 .5.4h4a.5.5 0 0 0 .5-.4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <div class="settings-panel" id="settings-panel" hidden>
    <div class="settings-row">
      <span class="settings-label">VIEW</span>
      <div class="settings-options" id="view-mode-options" role="group">
        <button type="button" data-mode="board">BOARD</button>
        <button type="button" data-mode="single">SINGLE</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">LOCATION (ZIP)</span>
      <div class="settings-options zip-input-group">
        <input type="text" id="zip-input" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="07020" autocomplete="off" />
        <button type="button" id="zip-set">SET</button>
      </div>
    </div>
    <div class="settings-row settings-status-row">
      <span class="settings-status" id="zip-status"></span>
    </div>
    <div class="settings-row">
      <span class="settings-label">FLIP EVERY</span>
      <div class="settings-options" id="interval-options" role="group">
        <button type="button" data-interval="15000">15S</button>
        <button type="button" data-interval="30000">30S</button>
        <button type="button" data-interval="60000">1M</button>
        <button type="button" data-interval="120000">2M</button>
        <button type="button" data-interval="300000">5M</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">SOUND</span>
      <div class="settings-options">
        <button type="button" id="mute-toggle" data-muted="false">ON</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">MAP</span>
      <div class="settings-options">
        <button type="button" id="map-toggle">ON</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">ROWS</span>
      <div class="settings-options row-stepper">
        <button type="button" id="rows-minus" aria-label="Fewer rows">&minus;</button>
        <span class="rows-count" id="rows-count">5</span>
        <button type="button" id="rows-plus" aria-label="More rows">+</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">RADIUS (MI)</span>
      <div class="settings-options row-stepper">
        <button type="button" id="radius-minus" aria-label="Smaller radius">&minus;</button>
        <span class="rows-count" id="radius-count">25</span>
        <button type="button" id="radius-plus" aria-label="Larger radius">+</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">DISPLAY</span>
      <div class="settings-options">
        <button type="button" id="fullscreen-toggle">FULLSCREEN</button>
      </div>
    </div>
  </div>

  <div class="board-content" id="board-content">
    <div class="column-headers">
      <span class="col col-flight">FLIGHT</span>
      <span class="col col-airline">AIRLINE</span>
      <span class="col col-route">ROUTE</span>
      <span class="col col-eta">ARR EST</span>
    </div>

    <div class="rows" id="rows"></div>

    <div class="empty-state" id="empty-state" hidden>
      <span>NO COMMERCIAL TRAFFIC OVERHEAD</span>
    </div>
  </div>

  <div class="single-content" id="single-content" hidden>
    <div class="single-card">
      <div class="single-top">
        <div class="single-logo-box" id="single-logo-box">
          <canvas class="single-logo-canvas" id="single-logo-canvas" width="160" height="160"></canvas>
        </div>
        <div class="single-info">
          <div class="single-flight" id="single-flight">&mdash;</div>
          <div class="single-route" id="single-route">&mdash;</div>
          <div class="single-type" id="single-type">&mdash;</div>
          <div class="single-telemetry" id="single-telemetry">&mdash;</div>
        </div>
      </div>
      <div class="single-departing">
        <div class="single-departing-label">Departing to</div>
        <div class="single-departing-dest" id="single-departing-dest">&mdash;</div>
      </div>
    </div>
  </div>
</div>

<div class="map-section" id="map-section" aria-hidden="true">
  <div id="map"></div>
  <div class="map-radius-label" id="map-radius-label">5MI RADIUS</div>
</div>
</div>

<div class="splash" id="splash">
  <div class="splash-inner">
    <svg class="splash-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
    <h1>OVERHEAD</h1>
    <p>Live flights over Edgewater, NJ</p>
    <button id="tap-start" type="button">TAP TO START BOARD</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="flap.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
